services:
  # =========================================================================
  # 1. PostgreSQL Relational Database with PGVector Extension
  # =========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: budget-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-YOUR_PGADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-budget_management_system}
    ports:
      # Defaults to host 5433 to avoid collision with any local Windows Postgres on 5432
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-budget_management_system}"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - budget-network

  # =========================================================================
  # 2. FastAPI ASGI Backend (ML, PGVector Search, Polyglot Bridge, JWT Auth)
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: budget-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-YOUR_PGADMIN_PASSWORD}@postgres:5432/${POSTGRES_DB:-budget_management_system}
      MONGO_URI: ${MONGO_URI:-mongodb+srv://<username>:<password>@<your-cluster>.mongodb.net/budget_management_system?retryWrites=true&w=majority}
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - budget-network

  # =========================================================================
  # 3. React Vite Frontend (Spendee-style UI served via Nginx Reverse Proxy)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: budget-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
      - "${FRONTEND_HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - budget-network

  # =========================================================================
  # Optional: Local MongoDB (For 100% Offline Mode without MongoDB Atlas Cloud)
  # Run: docker compose --profile offline up -d
  # =========================================================================
  mongo:
    image: mongo:7.0
    container_name: budget-mongo
    profiles: ["offline"]
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - budget-network

networks:
  budget-network:
    name: budget-network
    driver: bridge

volumes:
  postgres_data:
    name: budget_postgres_data
  mongo_data:
    name: budget_mongo_data
